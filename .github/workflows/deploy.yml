name: Deploy to GitHub Pages

# Manual-only for now: run from the Actions tab or `gh workflow run deploy.yml`.
# To deploy automatically on every push to main, uncomment the `push` trigger.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The editor builds against the *source* of bil-lbx (resolved by the Vite
      # alias / tsconfig path), so it's checked out as a sibling: ../bil-lbx
      # relative to the editor. weasel and obwat come from npm like any other
      # dependency.
      - name: Checkout lbx-editor
        uses: actions/checkout@v7
        with:
          path: lbx-editor

      - name: Checkout bil-lbx (.lbx parser)
        uses: actions/checkout@v7
        with:
          repository: orochi235/bil-lbx
          ref: main
          path: bil-lbx

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # bil-lbx is bundled from source; install its runtime deps so Vite can
      # resolve them (fast-xml-parser/jszip).
      - name: Install bil-lbx deps
        working-directory: bil-lbx
        run: npm ci

      - name: Install editor deps
        working-directory: lbx-editor
        run: npm ci

      - name: Build
        working-directory: lbx-editor
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: lbx-editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
